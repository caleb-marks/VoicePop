name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: PopcornHUD/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('PopcornHUD/Package.resolved', 'PopcornHUD/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build
        run: swift build --package-path PopcornHUD

      - name: Test
        run: swift test --package-path PopcornHUD
